<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>邦布语翻译器</title>
<meta name="description" content="人话和邦布语互相翻译的小工具：每个字带声调，原话藏在看不见的字符里，还能念出声来。单文件、离线可用，非官方同人作品。">
<meta name="theme-color" content="#101012" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2efe6" media="(prefers-color-scheme: light)">
<meta property="og:type" content="website">
<meta property="og:title" content="邦布语翻译器">
<meta property="og:description" content="人话和邦布语互相翻译的小工具：每个字带声调，原话藏在看不见的字符里，还能念出声来。非官方同人作品。">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
:root{
  --bg:#101012; --card:#1d1d22; --card2:#2b2b32; --field:#141418; --ink:#f3eedd; --muted:#aaa699;
  --edge:#6f6e78; --edge-strong:#f3eedd; --shade:#000000; --accent:#ffd400; --hot:#ff5a1f; --hot-text:#ff8a55;
  --dot:rgba(255,255,255,.07); --focus:#ffd400; --m-edge:#f3eedd; --band:rgba(255,212,0,.10);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#f2efe6; --card:#fffdf6; --card2:#e9e4d2; --field:#ffffff; --ink:#111111; --muted:#55524a;
    --edge:#111111; --edge-strong:#111111; --shade:#111111; --hot-text:#b3350a;
    --dot:rgba(0,0,0,.09); --focus:#d94400; --m-edge:#111111; --band:rgba(255,212,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background-color:var(--bg);
  background-image:radial-gradient(circle,var(--dot) 1.3px,transparent 1.8px);
  background-size:14px 14px;
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.55; overflow-x:hidden; position:relative;
}
/* 背景装饰:警示条纹色带 + 斜向淡色带 + 很淡的扫描线,全部不拦截点击 */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bg .stripe{position:absolute;left:0;right:0;top:0;height:12px;
  background:repeating-linear-gradient(-45deg,#ffd400 0 12px,#111 12px 24px);border-bottom:3px solid #111}
.bg .band{position:absolute;left:-20%;width:140%;top:62%;height:64px;transform:rotate(-8deg);
  background:var(--band)}
.scan{position:fixed;inset:0;z-index:60;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);mix-blend-mode:normal}
@media (prefers-color-scheme:light){.scan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0 1px,transparent 1px 3px)}}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:30px 16px 36px}

/* 标题区 */
.hero{display:flex;align-items:center;gap:14px;margin:4px 0 22px;position:relative}
.mascot-wrap{
  flex:0 0 auto;width:108px;height:108px;position:relative;overflow:hidden;
  background:var(--accent);border:4px solid var(--m-edge);border-radius:22px;
  box-shadow:5px 5px 0 var(--shade);transform:rotate(-3deg);
}
@media (max-width:420px){.mascot-wrap{width:80px;height:80px;border-radius:18px;border-width:3px}}
.mascot-img,.mascot-fallback{display:block;width:100%;height:100%}
.mascot-img{object-fit:cover;object-position:top center}
.mascot-fallback{display:none;padding:6px}
.mascot-wrap.noimg .mascot-img{display:none}
.mascot-wrap.noimg .mascot-fallback{display:block}
.mascot-fallback .torso,.mascot-fallback .ear{fill:#e9e6df;stroke:#111;stroke-width:5;stroke-linejoin:round}
.mascot-fallback .torso-line{fill:none;stroke:#111;stroke-width:5;stroke-linejoin:round}
.mascot-fallback .shade{fill:#cbc7bb}
.mascot-fallback .ear-in{fill:var(--hot)}
.mascot-fallback .hand,.mascot-fallback .foot{fill:#2b2b30;stroke:#111;stroke-width:3.5}
.mascot-fallback .screen{fill:#0b0b0e;stroke:#111;stroke-width:3.5}
.mascot-fallback .ring{fill:none;stroke:#ffd400;stroke-width:3.6}
.mascot-fallback .scarf{fill:#ff5a1f;stroke:#111;stroke-width:4;stroke-linejoin:round}
@keyframes bounce{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(-3deg) translateY(-8px)}}
body.speaking .mascot-wrap{animation:bounce .42s ease-in-out infinite}
.hero-text{min-width:0;flex:1 1 auto}
h1{
  margin:0;font-size:clamp(1.8rem,8.4vw,2.7rem);line-height:1.05;font-weight:900;letter-spacing:.02em;
  transform:skewX(-8deg);transform-origin:left bottom;text-shadow:3px 3px 0 var(--shade);
}
h1 .y{color:var(--accent)}
@media (prefers-color-scheme:light){
  h1{text-shadow:3px 3px 0 var(--hot)}
  h1 .y{text-shadow:3px 3px 0 #111;-webkit-text-stroke:2px #111;paint-order:stroke fill}
}
.sticker{
  display:inline-block;margin-left:10px;vertical-align:middle;font-size:1rem;font-weight:800;line-height:1.35;white-space:nowrap;
  background:var(--hot);color:#111;border:3px solid #111;padding:2px 10px;transform:skewX(8deg) rotate(-6deg);
  box-shadow:3px 3px 0 var(--shade);letter-spacing:.08em;text-shadow:none;-webkit-text-stroke:0;
}
.serial{position:absolute;right:0;top:-6px;display:none;text-align:right;font:700 .7rem var(--mono);color:var(--muted);letter-spacing:.08em}
.barcode{height:22px;width:92px;margin:0 0 3px auto;
  background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 13px)}
@media (min-width:600px){.serial{display:block}}
.cross{position:absolute;width:16px;height:16px;pointer-events:none;opacity:.7;
  background:linear-gradient(var(--muted),var(--muted)) center/100% 2px no-repeat,linear-gradient(var(--muted),var(--muted)) center/2px 100% no-repeat}

/* 卡片 */
.pair{display:grid;grid-template-columns:minmax(0,1fr);gap:30px;margin-bottom:30px}
@media (min-width:800px){
  .pair{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px}
  .pair .card{display:flex;flex-direction:column}
  .pair #human{flex:1 1 auto}
}
.card{
  position:relative;background:var(--card);border:3px solid var(--edge);padding:26px 16px 16px;
  margin-bottom:30px;min-width:0;box-shadow:6px 6px 0 var(--shade);
}
.pair .card{margin-bottom:0}
.tag{
  position:absolute;top:-17px;left:12px;background:var(--accent);color:#111;border:3px solid #111;
  font:800 .78rem/1.2 var(--mono);letter-spacing:.06em;padding:3px 10px;text-transform:uppercase;
  transform:skewX(-8deg);white-space:nowrap;
}
label.tag{cursor:pointer}
textarea{
  display:block;width:100%;min-height:140px;resize:vertical;font:inherit;font-size:1.05rem;color:var(--ink);
  background:var(--field);border:3px solid var(--edge);border-radius:0;padding:10px 12px;overflow-wrap:anywhere;
}
textarea::placeholder{color:var(--muted);opacity:1}
textarea:focus{border-color:var(--focus)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}

/* 按钮:厚边 + 硬阴影 + 按下去 */
button{
  font:inherit;font-weight:700;color:var(--ink);background:var(--card2);border:3px solid var(--edge);
  border-radius:0;padding:6px 16px;min-height:44px;cursor:pointer;box-shadow:4px 4px 0 var(--shade);
  transition:transform .06s,box-shadow .06s,background .1s;
}
button:hover:not(:disabled){background:var(--card);border-color:var(--edge-strong)}
button:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shade)}
button:disabled{opacity:.5;cursor:not-allowed;border-style:dashed;box-shadow:none;transform:translate(2px,2px);
  background:repeating-linear-gradient(-45deg,var(--card2) 0 6px,var(--card) 6px 12px)}
button.primary{background:var(--accent);color:#111;border-color:#111}
button.primary:hover:not(:disabled){background:#ffe14d;border-color:#111}
button.primary:disabled{color:#333;background:repeating-linear-gradient(-45deg,#b59a00 0 6px,#8a7600 6px 12px);border-color:#111}
.btn{display:inline-flex;align-items:center;justify-content:center;transform:skewX(-8deg)}
.btn > *{transform:skewX(8deg)}
.btn:active:not(:disabled){transform:translate(3px,3px) skewX(-8deg)}
.btn:disabled{transform:translate(2px,2px) skewX(-8deg)}
.btn svg{width:18px;height:18px;margin-right:7px;flex:0 0 auto;fill:currentColor}
.btn svg .st{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn .t{display:inline-block}

/* 音节条:小屏幕 + 键帽 */
.strip{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;padding:12px;min-height:66px;
  background:#0d0d10 repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px);
  border:3px solid var(--edge);color:#b9b5a6;
  box-shadow:inset 0 0 0 2px #000;
}
.chip{
  min-height:40px;padding:2px 12px;font-size:1.3rem;line-height:1.2;font-weight:700;
  background:#ece7d6;color:#111;border:2px solid #000;border-bottom-width:5px;border-radius:8px;box-shadow:none;
}
.chip:hover:not(:disabled){background:#fff8de;border-color:#000}
.chip:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px;box-shadow:none;margin-bottom:3px}
.chip .t{font-size:.9rem;opacity:.8}
.chip.long{position:relative;padding-right:32px;min-width:64px}
.chip.long::after{content:"";position:absolute;right:8px;top:52%;width:15px;height:0;border-top:3px solid currentColor;opacity:.75}
.chip.long.wavy::after{border-top-style:dotted;width:17px}
.chip.short{padding:2px 6px;font-size:1.02rem;min-width:30px}
.chip.playing{background:var(--accent);color:#111;box-shadow:0 0 14px 2px #ffd400;transform:translateY(-3px)}
.dim{color:#b9b5a6;font-size:.95rem;overflow-wrap:anywhere;white-space:pre-wrap}
.nl{flex-basis:100%;height:0}
.hint{margin:10px 2px 0;color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}

/* 控件 */
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;min-height:44px;font-size:.98rem;cursor:pointer}
input[type=checkbox]{
  -webkit-appearance:none;appearance:none;flex:0 0 auto;width:26px;height:26px;margin:0;cursor:pointer;
  border:3px solid var(--edge);background:var(--field);display:grid;place-content:center;box-shadow:3px 3px 0 var(--shade);
}
input[type=checkbox]:checked{background:var(--accent);border-color:#111}
input[type=checkbox]:checked::after{content:"";width:6px;height:12px;border:solid #111;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.sliders .srow{display:grid;grid-template-columns:5em minmax(0,1fr) 5em;align-items:center;gap:10px;margin:10px 0;min-height:44px}
.sliders .n{font-weight:700}
.sliders output{text-align:right;color:var(--muted);white-space:nowrap;font-family:var(--mono);font-size:.9rem}
.sliders .note{margin:6px 0 0;color:var(--muted);font-size:.85rem}
select{
  -webkit-appearance:none;appearance:none;grid-column:2 / 4;width:100%;min-width:0;min-height:44px;font:inherit;font-weight:700;
  color:var(--ink);background-color:var(--field);border:3px solid var(--edge);border-radius:0;padding:6px 38px 6px 12px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 21px) 50%,calc(100% - 15px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat;
  box-shadow:3px 3px 0 var(--shade);cursor:pointer;
}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;min-width:0;height:34px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:12px;background:var(--field);border:3px solid var(--edge);border-radius:0}
input[type=range]::-moz-range-track{height:6px;background:var(--field);border:3px solid var(--edge);border-radius:0}
input[type=range]::-moz-range-progress{height:6px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:20px;height:28px;margin-top:-10px;background:var(--accent);
  border:3px solid #111;border-radius:0;box-shadow:3px 3px 0 var(--shade);
}
input[type=range]::-moz-range-thumb{
  box-sizing:border-box;width:20px;height:28px;background:var(--accent);border:3px solid #111;border-radius:0;box-shadow:3px 3px 0 var(--shade);
}
#status{
  position:fixed;z-index:70;left:16px;right:16px;bottom:16px;max-width:788px;margin:0 auto;padding:8px 14px;
  color:var(--hot-text);font:700 .92rem var(--mono);overflow-wrap:anywhere;pointer-events:none;
  border-left:6px solid var(--hot);background:var(--card);box-shadow:4px 4px 0 var(--shade);
}
#status:empty{visibility:hidden}

/* 折叠区 */
details.card{padding:26px 16px 6px}
summary{
  display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-weight:800;list-style:none;padding-bottom:6px;
}
summary::-webkit-details-marker{display:none}
summary::before{
  content:"";flex:0 0 auto;width:0;height:0;border-style:solid;border-width:7px 0 7px 11px;border-color:transparent transparent transparent var(--accent);
  transition:transform .12s;
}
details[open] > summary::before{transform:rotate(90deg)}
details p,details li{font-size:.95rem}
details > div,details > p{margin-bottom:12px}
.recrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 0;border-top:2px dashed var(--edge)}
.recrow:first-of-type{border-top:0}
.recrow .c{font-size:1.6rem;min-width:1.6em;font-weight:900;color:var(--accent)}
.recrow .st{color:var(--muted);font-size:.9rem;flex:1 1 7em;min-width:0}
.recrow button{padding:4px 12px;font-size:.9rem;min-height:40px;box-shadow:3px 3px 0 var(--shade)}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="band"></div><div class="stripe"></div></div>
<div class="scan" aria-hidden="true"></div>
<main class="wrap">
  <header class="hero">
    <div id="mascot" class="mascot-wrap">
      <img class="mascot-img" src="assets/bangboo.png" alt="邦布" width="96" height="96" onerror="this.parentNode.classList.add('noimg')">
      <svg class="mascot-fallback" viewBox="0 0 120 120" role="img" aria-label="原创绘制的同人邦布吉祥物">
        <path class="ear" d="M38 55 L28 22 C26 12 31 7 36 7 C42 7 46 12 45 22 L50 55 Z"></path>
        <path class="ear-in" d="M43 52 L40.5 22 C40.5 16 44.5 16 44.5 22 L48.5 52 Z"></path>
        <path class="ear" d="M82 55 L92 22 C94 12 89 7 84 7 C78 7 74 12 75 22 L70 55 Z"></path>
        <path class="ear-in" d="M77 52 L79.5 22 C79.5 16 75.5 16 75.5 22 L71.5 52 Z"></path>
        <ellipse class="hand" cx="15" cy="82" rx="7" ry="11" transform="rotate(22 15 82)"></ellipse>
        <ellipse class="hand" cx="105" cy="82" rx="7" ry="11" transform="rotate(-22 105 82)"></ellipse>
        <ellipse class="foot" cx="42" cy="113" rx="13" ry="6"></ellipse>
        <ellipse class="foot" cx="78" cy="113" rx="13" ry="6"></ellipse>
        <path class="torso" d="M60 38 C84 38 96 54 98 74 C100 96 90 112 60 112 C30 112 20 96 22 74 C24 54 36 38 60 38 Z"></path>
        <path class="shade" d="M98 74 C100 96 90 112 60 112 C76 108 92 98 98 74 Z"></path>
        <path class="torso-line" d="M60 38 C84 38 96 54 98 74 C100 96 90 112 60 112 C30 112 20 96 22 74 C24 54 36 38 60 38 Z"></path>
        <rect class="screen" x="32" y="51" width="56" height="31" rx="14"></rect>
        <circle class="ring" cx="47" cy="67" r="6.5"></circle>
        <circle class="ring" cx="73" cy="67" r="6.5"></circle>
        <rect class="scarf" x="24" y="85" width="72" height="12" rx="6"></rect>
        <rect class="scarf" x="79" y="92" width="13" height="19" rx="5" transform="rotate(-8 85 92)"></rect>
      </svg>
    </div>
    <div class="hero-text">
      <h1><span class="y">邦布语</span>翻译器<span class="sticker">嗯呐！</span></h1>
    </div>
    <div class="serial" aria-hidden="true"><div class="barcode"></div>NO.0001 // 非官方</div>
  </header>

  <div class="pair">
    <section class="card">
      <label class="tag" for="human">HUMAN // 人话</label>
      <textarea id="human" placeholder="在这里写点什么……" spellcheck="false"></textarea>
      <div class="row">
        <button id="humanCopy" type="button" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="st" x="8" y="8" width="12" height="12" rx="1.5"></rect><path class="st" d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"></path></svg><span class="t">复制</span></button>
        <button id="humanClear" type="button" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="st" d="M6 6l12 12M18 6L6 18"></path></svg><span class="t">清空</span></button>
      </div>
      <label class="chk"><input id="showParen" type="checkbox"> 同时显示括号里的原文</label>
    </section>

    <section class="card">
      <label class="tag" for="bang">BANGBOO // 邦布语</label>
      <i class="cross" style="right:8px;top:8px" aria-hidden="true"></i>
      <textarea id="bang" placeholder="嗯ˉ呐ˊ哒ˋ！（交给我吧）" spellcheck="false"></textarea>
      <div id="strip" class="strip" aria-label="音节条"></div>
      <p id="hint" class="hint"></p>
      <div class="row">
        <button id="play" type="button" class="btn primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5l13 7.5-13 7.5z"></path></svg><span class="t">听它说</span></button>
        <button id="stop" type="button" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="5.5" width="13" height="13" rx="1.5"></rect></svg><span class="t">停</span></button>
        <button id="bangCopy" type="button" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="st" x="8" y="8" width="12" height="12" rx="1.5"></rect><path class="st" d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"></path></svg><span class="t">复制</span></button>
        <button id="bangClear" type="button" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="st" d="M6 6l12 12M18 6L6 18"></path></svg><span class="t">清空</span></button>
      </div>
    </section>
  </div>

  <p id="status" role="status" aria-live="polite"></p>

  <section class="card sliders">
    <span class="tag">VOICE // 声音</span>
    <div class="srow">
      <span class="n">音色</span>
      <select id="preset" aria-label="音色"></select>
    </div>
    <div class="srow">
      <span class="n">音高倍率</span>
      <input id="pitch" type="range" min="0.7" max="1.4" step="0.01" value="1" aria-label="音高倍率（在所选音色的基准音高上相乘）">
      <output id="pitchV">380 Hz</output>
    </div>
    <div class="srow">
      <span class="n">语速</span>
      <input id="speed" type="range" min="0.6" max="1.6" step="0.05" value="1" aria-label="语速">
      <output id="speedV">1.00x</output>
    </div>
    <p class="note">音高倍率是在所选音色的基准音高上再乘的倍率，右边显示的是实际音高。</p>
  </section>

  <details id="rec" class="card">
    <summary><span class="tag">REC // 录音</span>录制我的邦布音</summary>
    <p>点“录音”后说一个字，约 1.2 秒后自动停止。录好的字会替换合成器的声音，保存在本机浏览器里。如果麦克风用不了，可以上传音频文件。</p>
    <div id="recRows"></div>
    <div class="row"><button id="recReset" type="button">全部恢复合成器</button></div>
    <div style="height:10px"></div>
  </details>

</main>

<script id="core">
(function (root) {
  'use strict';

  var STARTS = '嗯咦哇';            // 嗯 咦 哇
  var ENDERS = '呐哒';                  // 呐 哒
  var LETTERS = STARTS + ENDERS;
  var MARKS = 'ˉˊˇˋ';       // 一二三四声
  var TONE_CH = ['', 'ˉ', 'ˊ', 'ˇ', 'ˋ'];
  var OPEN = '（', CLOSE = '）';
  var Q = '？', EX = '！', ELL = '……', TIL = '～';
  var BANG_PUNCT = '？！…～?!~';
  var ENDP = '。!?！？…';      // 切句用的句末标点
  var CLOSERS = '”’」』）)]】》"\'］〕}';
  var CORE = /[\p{L}\p{N}\p{Extended_Pictographic}]/u;
  var SAD_RE = /唉|呜|难过|伤心|对不起|抱歉|可惜|好累|想哭/;
  var EXC_RE = /哇|好耶|哈哈|太(?![阳空平极监])[^，。！？\s]{1,3}了/;

  function isL(c) { return c !== undefined && c !== '' && LETTERS.indexOf(c) >= 0; }
  function isStarter(c) { return STARTS.indexOf(c) >= 0; }

  // ---------- 确定性随机 ----------
  function fnv(s) {

    c: [1, 2, 2, 1, 2],
    e: [0.5, 4, 1, 0.5, 4],
    s: [3, 0.5, 0.5, 4, 3],
    q: [1, 2, 3, 1, 1]

    q: [0.2, 0.7, 0.1], e: [0.25, 0.1, 0.65], s: [1, 0, 0], c: [0.7, 0.15, 0.15]

  // 返回 [{ch,tone}] 与句末标点
  function buildSyllables(m, mood, rng) {

      for (j = 0; j < b - 1; j++) w.push({ ch: '呐', tone: pickWeighted(rng, TONE_W[mood]) });

    }

    for (i = 0; i < out.length; i++) if (out[i].ch === '呐') hasNa = true;

  // 只返回邦布语部分(不含括号)。
  function encodeSentence(sentence) {

    var rng = mulberry32(fnv(s));

    for (var i = 0; i < syl.length; i++) res += syl[i].ch + TONE_CH[syl[i].tone];

    else if (mood === 's') res += ELL;

  }

  // ---------- 切句 ----------
  function splitLine(line) {
    var out = [], i = 0, n = line.length;

      var j = i;

      while (k < n) {

          while (k < n && CLOSERS.indexOf(line.charAt(k)) >= 0) k++;

      while (e > i && isWS(line.charAt(e - 1))) e--;

  // ---------- 隐形载荷 ----------

  var fc = String.fromCharCode;

  // 从 i 起读一串连续的变体选择符,返回 [结束下标, 字符个数]

  // ---------- 分词 / 解码 ----------
  // 第一个"后面(跳过空白)是结尾或五个字之一"的闭括号即为结尾;

    else if (max >= 3) what = '很着急';

      else if (toks[i + 1] && toks[i + 1].type === 'paren') continue;
      else if (t.hidden !== null) out += t.hidden;
      else if (t.hiddenLen > 0) out += OPEN + '听不懂' + String.fromCharCode(0xFF1A) + '藏在里面的话好像被弄丢了' + CLOSE;

  }

  // ---------- 发音计划 ----------
  // 一个小句(以标点结束,或到邦布语段结束)的节奏规则。纯函数,结果写进每个音节的 rate/gain/len/wavy。
  // 一、位置规则:单个起头字 0.85;连续重复的起头字 0.55(断奏);词中间的收尾字 0.9;词尾的呐 1.15;哒 0.7。
  //    轻声的缩短由合成器处理,这里不重复乘。
  // 二、小句末尾规则(按标点种类,优先级 ？ > ！ > …… > ～):
  //    无标点 末字 x1.25;～ 末字 x1.9 且 wavy;？ 末字 x1.5;
  //    ！ 整句 x0.85,末字 gain 1.35;…… 整句 x1.2、末字再 x1.7,gain 由 0.8 线性降到 0.55。
  //    同一种标点每多写一个,效果加强 15%,最多算两个额外的("……"算一个)。
  //    末字是哒时,拉长倍率减半:1 + (倍率 - 1) / 2。
  // 三、len:rate >= 1.4 为 long,<= 0.7 为 short,其余 normal。
  function clauseKind(punct) {

      else if (c === '!' || c === EX) e++;
      else if (c === '…') d++;
      else if (c === '~' || c === TIL) t++;

    if (q) return { kind: 'q', n: q };
    if (e) return { kind: 'e', n: e };

    var ck = clauseKind(punct), m = ck.kind, L = syls.length;

    var j;

      var prevSame = j > 0 && syls[j - 1].ch === sy.ch, nextSame = j < L - 1 && syls[j + 1].ch === sy.ch;
      if (isStarter(sy.ch)) rate = (prevSame || nextSame) ? 0.55 : 0.85;
      else if (sy.ch === '哒') rate = 0.7;
      else rate = (j < L - 1 && isEnder(syls[j + 1].ch)) ? 0.9 : 1.15;

      if (m === 'q') pitch = 1 + 0.12 * (L > 1 ? j / (L - 1) : 0.5);
      else if (m === 'e') { pitch = 1.1; gain = 1 + 0.25 * strength; rate *= 1 - 0.15 * strength; }
      else if (m === 's') {
        pitch = 0.86;
        gain = L > 1 ? 0.8 - 0.25 * j / (L - 1) : 0.55;
        rate *= 1 + 0.2 * strength;
      }

      if (j === L - 1) {
        var mul = 1;
        if (m === 'c') mul = 1.25;
        else if (m === 't') { mul = 1 + 0.9 * strength; wavy = true; }
        else if (m === 'q') mul = 1 + 0.5 * strength;
        else if (m === 's') mul = 1 + 0.7 * strength;
        else if (m === 'e') gain = 1 + 0.35 * strength;
        if (mul > 1 && sy.ch === '哒') mul = 1 + (mul - 1) / 2;
        rate *= mul;
      }

      var gap = 0.04;
      if (j < L - 1) { if (isEnder(sy.ch) && isStarter(syls[j + 1].ch)) gap = 0.09; }
      else gap = punct ? (m === 's' ? 0.4 : 0.28) : 0.12;
      items.push({
        ch: sy.ch, tone: sy.tone, pos: sy.pos, end: sy.end,
        pitch: pitch, gain: gain, rate: rate, gap: gap, mood: m === 't' ? 'c' : m,
        len: rate >= 1.4 ? 'long' : (rate <= 0.7 ? 'short' : 'normal'), wavy: wavy
      });
    }
  }
  function parseBang(tok, items) {
    var s = tok.text, i = 0, syls = [], punct = '';
    while (i < s.length) {
      var c = s.charAt(i);
      if (isL(c)) {
        if (punct !== '') { finishClause(syls, punct, items); syls = []; punct = ''; }
        var sy = { ch: c, tone: 0, pos: tok.start + i, end: tok.start + i + 1 };
        i++;
        var mk = MARKS.indexOf(s.charAt(i));
        if (i < s.length && mk >= 0) { sy.tone = mk + 1; sy.end++; i++; }
        syls.push(sy);
      } else {
        if (BANG_PUNCT.indexOf(c) >= 0) punct += c;
        i++;
      }
    }
    if (syls.length) finishClause(syls, punct, items);
  }
  function bump(items, g) {
    if (items.length) { var l = items[items.length - 1]; if (l.gap < g) l.gap = g; }
  }
  function plan(text) {
    var toks = tokenize(text), items = [];
    for (var i = 0; i < toks.length; i++) {
      var t = toks[i];
      if (t.type === 'bang') parseBang(t, items);
      else if (t.type === 'paren') bump(items, 0.35);
      else if (t.text.indexOf('\n') >= 0) bump(items, 0.35);
    }
    return items;
  }

  root.Bangboo = {
    encode: encode, decode: decode, encodeSentence: encodeSentence, tokenize: tokenize,
    plan: plan, isGrammatical: isGrammatical, describe: describe,
    hide: hide, reveal: reveal, stripHidden: stripHidden,
    TONE_CH: TONE_CH, MARKS: MARKS, LETTERS: LETTERS, STARTS: STARTS, ENDERS: ENDERS
  };
})(globalThis);
</script>

    var msg = '';
    if (!text) msg = '';
    else if (ok > 0) msg = '这段邦布语里藏了 ' + ok + ' 个字的原话（看不见，但复制时会一起带走）。' + (bad ? '另有 ' + bad + ' 段藏着的话已损坏。' : '');
    else if (bad > 0) msg = '这段邦布语里有藏着的话，但已损坏，还原不出来了。';
    else msg = '这段邦布语里没有藏原话，只能读出语气。';
    els.hint.textContent = msg;
  }

  // ================= 文本同步 =================
  function onHuman() {
    stopAll();
    els.bang.value = B.encode(els.human.value, { paren: S.paren });
    renderStrip(els.bang.value);
  }
  function onBang() {
    stopAll();
    els.human.value = B.decode(els.bang.value);
    renderStrip(els.bang.value);
  }

  function copyText(ta) {
    var text = ta.value;
    if (!text) { say('没有内容可复制。'); return; }
    function fallback() {
      try {
        ta.focus(); ta.select();
        var ok = document.execCommand('copy');
        say(ok ? '已复制。' : '复制失败，请手动选中后复制。');
      } catch (e) { say('复制失败，请手动选中后复制。'); }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { say('已复制。'); }, fallback);
      } else fallback();
    } catch (e) { fallback(); }
  }

  // ================= 设置 =================
  function loadSettings() {
    try {
      var j = JSON.parse(localStorage.getItem('bangboo.settings') || '{}');
      if (typeof j.pitchMul === 'number' && isFinite(j.pitchMul)) S.pitchMul = clamp(j.pitchMul, 0.7, 1.4);
      if (typeof j.speed === 'number' && isFinite(j.speed)) S.speed = clamp(j.speed, 0.6, 1.6);
      if (typeof j.preset === 'string' && PRESETS[j.preset]) S.presetName = j.preset;
      if (typeof j.paren === 'boolean') S.paren = j.paren;
    } catch (e) { /* 读不到就用默认值 */ }
  }
  function saveSettings() {
    try {
      localStorage.setItem('bangboo.settings', JSON.stringify({
        pitchMul: S.pitchMul, speed: S.speed, preset: S.presetName, paren: S.paren
      }));
    } catch (e) { /* 忽略 */ }
  }
  function syncSliders() {
    els.pitch.value = S.pitchMul; els.speed.value = S.speed;
    els.preset.value = S.presetName; els.paren.checked = S.paren;
    els.pitchV.textContent = Math.round(curPreset().base * S.pitchMul) + ' Hz';
    els.speedV.textContent = S.speed.toFixed(2) + 'x';
  }

  // ================= IndexedDB =================
  function idbOpen() {
    return new Promise(function (res, rej) {
      try {
        if (!window.indexedDB) { rej(new Error('no indexedDB')); return; }
        var rq = indexedDB.open('bangboo-voice', 1);
        rq.onupgradeneeded = function () { rq.result.createObjectStore('samples', { keyPath: 'ch' }); };
        rq.onsuccess = function () { res(rq.result); };
        rq.onerror = function () { rej(rq.error || new Error('indexedDB error')); };
        rq.onblocked = function () { rej(new Error('indexedDB blocked')); };
      } catch (e) { rej(e); }
    });
  }
  function idbTx(mode, fn) {
    return idbOpen().then(function (db) {
      return new Promise(function (res, rej) {
        var req;
        try {
          var tx = db.transaction('samples', mode);
          req = fn(tx.objectStore('samples'));
          tx.oncomplete = function () { db.close(); res(req && req.result); };
          tx.onerror = tx.onabort = function () { db.close(); rej(tx.error || new Error('indexedDB tx')); };
        } catch (e) { try { db.close(); } catch (e2) { /* 忽略 */ } rej(e); }
      });
    });
  }
  var idbPut = function (rec) { return idbTx('readwrite', function (st) { return st.put(rec); }); };
  var idbDelete = function (ch) { return idbTx('readwrite', function (st) { return st.delete(ch); }); };
  var idbClear = function () { return idbTx('readwrite', function (st) { return st.clear(); }); };
  var idbAll = function () { return idbTx('readonly', function (st) { return st.getAll(); }); };

  // ================= 录音 =================
  function decodeAudio(ab) {
    return new Promise(function (res, rej) {
      try {
        var p = S.ctx.decodeAudioData(ab, res, rej);
        if (p && p.then) p.then(res, rej);
      } catch (e) { rej(e); }
    });
  }
  // 裁掉首尾静音,最长 0.6 秒,归一化。几乎没声音返回 null。
  function processBuffer(ab) {
    var src = ab.getChannelData(0), rate = ab.sampleRate, n = src.length, i, peak = 0;
    for (i = 0; i < n; i++) { var v = Math.abs(src[i]); if (v > peak) peak = v; }
    if (peak < 0.02) return null;
    var thr = Math.max(0.01, peak * 0.08), s = 0, e = n - 1;
    while (s < n && Math.abs(src[s]) < thr) s++;
    while (e > s && Math.abs(src[e]) < thr) e--;
    s = Math.max(0, s - Math.floor(rate * 0.01));
    e = Math.min(n - 1, e + Math.floor(rate * 0.02));
    var len = Math.min(e - s + 1, Math.floor(rate * 0.6));
    if (len < Math.floor(rate * 0.03)) return null;
    var out = new Float32Array(len), k = 0.9 / peak;
    for (i = 0; i < len; i++) out[i] = src[s + i] * k;
    return { ch: '', data: out, rate: rate };
  }
  function importAudio(ch, arrayBuf) {
    return decodeAudio(arrayBuf).then(function (ab) {
      var rec = processBuffer(ab);
      if (!rec) { say('几乎没录到声音，请靠近麦克风再试一次。'); return; }
      rec.ch = ch;
      S.samples[ch] = rec; delete S.bufs[ch];
      refreshRec();
      return idbPut({ ch: ch, data: rec.data, rate: rec.rate }).then(function () {
        say('已保存“' + ch + '”的录音。');
      }, function () {
        say('“' + ch + '”的录音可以用，但浏览器不让保存，刷新后会丢失。');
      });
    }, function () { say('音频解码失败，换一个文件或重新录一次。'); });
  }
  function recordChar(ch) {
    if (S.recBusy) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
      say('这个浏览器不能录音，请改用“上传音频”。'); return;
    }
    try { ensureCtx(); } catch (e) { say('这个浏览器不能处理音频。'); return; }
    stopAll();
    S.recBusy = true; refreshRec();
    function done() { S.recBusy = false; refreshRec(); }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var chunks = [], mr;
      function release() { try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) { /* 忽略 */ } }
      try { mr = new MediaRecorder(stream); } catch (e) { release(); say('无法开始录音。'); done(); return; }
      mr.ondataavailable = function (ev) { if (ev.data && ev.data.size) chunks.push(ev.data); };
      mr.onerror = function () { release(); say('录音出错了。'); done(); };
      mr.onstop = function () {
        release();
        var blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
        blob.arrayBuffer().then(function (ab) { return importAudio(ch, ab); })
          .catch(function () { say('录音处理失败。'); })
          .then(done);
      };
      try { mr.start(); } catch (e) { release(); say('无法开始录音。'); done(); return; }
      say('录音中……请说“' + ch + '”。');
      setTimeout(function () { try { if (mr.state !== 'inactive') mr.stop(); } catch (e) { /* 忽略 */ } }, 1200);
    }, function () {
      say('无法使用麦克风（可能被拒绝了），可以改用“上传音频”。');
      done();
    });
  }
  function uploadChar(ch, file) {
    if (!file) return;
    try { ensureCtx(); } catch (e) { say('这个浏览器不能处理音频。'); return; }
    file.arrayBuffer().then(function (ab) { return importAudio(ch, ab); })
      .catch(function () { say('读取文件失败。'); });
  }
  function removeChar(ch) {
    delete S.samples[ch]; delete S.bufs[ch];
    refreshRec();
    idbDelete(ch).then(function () { say('已删除“' + ch + '”的录音，改回合成器。'); },
      function () { say('已改回合成器，但浏览器存储没能同步删除。'); });
  }
  function resetAll() {
    S.samples = {}; S.bufs = {};
    refreshRec();
    idbClear().then(function () { say('全部恢复为合成器。'); },
      function () { say('已恢复合成器，但浏览器存储没能清除。'); });
  }

  var recUI = {};
  function buildRec() {
    var box = $('recRows');
    CHARS.forEach(function (ch) {
      var row = el('div', 'recrow');
      var st = el('span', 'st', '');
      var bRec = el('button', null, '录音'), bUp = el('button', null, '上传音频');
      var bPlay = el('button', null, '试听'), bDel = el('button', null, '删除');
      [bRec, bUp, bPlay, bDel].forEach(function (b) { b.type = 'button'; });
      var file = document.createElement('input');
      file.type = 'file'; file.accept = 'audio/*'; file.className = 'hidden';
      file.setAttribute('aria-label', '上传“' + ch + '”的音频文件');
      bRec.addEventListener('click', function () { recordChar(ch); });
      bUp.addEventListener('click', function () { file.click(); });
      file.addEventListener('change', function () { uploadChar(ch, file.files && file.files[0]); file.value = ''; });
      bPlay.addEventListener('click', function () { playOne(ch, 1, null, null); });
      bDel.addEventListener('click', function () { removeChar(ch); });
      row.appendChild(el('span', 'c', ch));
      row.appendChild(st);
      [bRec, bUp, bPlay, bDel, file].forEach(function (x) { row.appendChild(x); });
      box.appendChild(row);
      recUI[ch] = { st: st, rec: bRec, del: bDel };
    });
  }
  function refreshRec() {
    CHARS.forEach(function (ch) {
      var u = recUI[ch], s = S.samples[ch];
      u.st.textContent = s ? '已录音（' + (s.data.length / s.rate).toFixed(2) + ' 秒）' : '合成器';
      u.del.disabled = !s;
      u.rec.disabled = S.recBusy;
      u.rec.textContent = S.recBusy ? '请稍候' : '录音';
    });
  }

  // ================= 初始化 =================
  function init() {
    PRESET_ORDER.forEach(function (k) {
      var o = el('option', null, PRESETS[k].label);
      o.value = k;
      els.preset.appendChild(o);
    });
    loadSettings(); syncSliders();
    buildRec(); refreshRec();
    els.preset.addEventListener('change', function () {
      if (PRESETS[els.preset.value]) S.presetName = els.preset.value;
      syncSliders(); saveSettings();
    });
    els.paren.addEventListener('change', function () {
      S.paren = !!els.paren.checked; saveSettings();
      if (els.human.value) onHuman();
    });
    els.human.addEventListener('input', onHuman);
    els.bang.addEventListener('input', onBang);
    $('humanCopy').addEventListener('click', function () { copyText(els.human); });
    $('bangCopy').addEventListener('click', function () { copyText(els.bang); });
    $('humanClear').addEventListener('click', function () { els.human.value = ''; onHuman(); });
    $('bangClear').addEventListener('click', function () { els.bang.value = ''; onBang(); });
    $('play').addEventListener('click', speak);
    $('stop').addEventListener('click', stopAll);
    $('recReset').addEventListener('click', resetAll);
    els.pitch.addEventListener('input', function () {
      S.pitchMul = clamp(parseFloat(els.pitch.value) || 1, 0.7, 1.4); syncSliders(); saveSettings();
    });
    els.speed.addEventListener('input', function () {
      S.speed = clamp(parseFloat(els.speed.value) || 1, 0.6, 1.6); syncSliders(); saveSettings();
    });
    renderStrip(els.bang.value);
    idbAll().then(function (list) {
      (list || []).forEach(function (r) {
        if (r && r.data && r.rate && CHARS.indexOf(r.ch) >= 0) S.samples[r.ch] = { ch: r.ch, data: r.data, rate: r.rate };
      });
      refreshRec();
    }, function () {
      say('这个浏览器不让保存录音，录音功能仍可用，但刷新后会丢失。');
    });
  }
  init();
})();
</script>
</body>
</html>
